language = "C"
header = "/* CarbonMirror core C ABI. Generated by cbindgen from rust/carbon-core — do not edit. */"
include_guard = "CARBON_CORE_H"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
usize_is_size_t = true
documentation = true

[export]
include = ["CmStatus", "FailureClass", "UiState"]

[export.rename]
"FailureClass" = "CmFailureClass"
"UiState" = "CmUiState"

[enum]
prefix_with_name = true

[parse]
parse_deps = false
