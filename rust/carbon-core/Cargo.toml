[package]
name = "carbon-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "PolyForm-Noncommercial-1.0.0"
description = "CarbonMirror security core: protocol parsing, policy and TLS, shared by the Mac app and the phone server."
publish = false

[lib]
name = "carbon_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
aws-lc-rs = "1"
rcgen = { version = "0.14.7", default-features = false, features = ["aws_lc_rs", "crypto"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["aws-lc-rs", "std"] }
time = { version = "0.3", default-features = false, features = ["std"] }
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

