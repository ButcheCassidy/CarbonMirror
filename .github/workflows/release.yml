name: Release

# Manual only. Releases are source-only: one Linux job builds the phone parts (server, phone core library, companion
# APK) and packs them into CarbonMirror-<version>-source.zip next to the source; users build the Mac app themselves
# with scripts/build-mac.sh. publish=false uploads the zip as an artifact; publish=true also tags
# v<CFBundleShortVersionString> and publishes a release with only the zip and SHA256SUMS.txt. No macOS runner is used.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  phone:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Rust for the phone
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Server and phone core library
        run: bash scripts/build-server.sh
      - name: Companion APK (release key from the release environment, else a one-time key)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CM_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CM_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          export CM_KEYSTORE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$CM_KEYSTORE"' EXIT
          if [ -n "$KEYSTORE_BASE64" ]; then
            export CM_KEY_PASS="${CM_KEY_PASS:-$CM_KEYSTORE_PASS}"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$CM_KEYSTORE"
          else
            echo "::warning::No release keystore in the release environment: signing with a one-time P-384 key that is discarded after this run."
            export CM_KEYSTORE_PASS="$(openssl rand -hex 32)" CM_KEY_ALIAS=carbonmirror
            export CM_KEY_PASS="$CM_KEYSTORE_PASS"
            keytool -genkeypair -keyalg EC -groupname secp384r1 -sigalg SHA384withECDSA -validity 10000 \
              -dname "CN=CarbonMirror Companion one-time release key" -alias carbonmirror -storetype PKCS12 \
              -keystore "$CM_KEYSTORE" -storepass:env CM_KEYSTORE_PASS > /dev/null
          fi
          bash scripts/build-apk.sh
      - name: Source zip with the phone parts inside
        run: |
          VERSION="$(grep -A1 '<key>CFBundleShortVersionString</key>' Resources/Info.plist | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')"
          echo "$VERSION" > Resources/phone-parts.version
          ZIP="CarbonMirror-$VERSION-source.zip"
          git archive --format=zip --prefix="CarbonMirror-$VERSION/" -o "$ZIP" HEAD
          mkdir -p "stage/CarbonMirror-$VERSION/Resources"
          cp Resources/carbonmirror-server Resources/libcarbon_core.so Resources/CarbonMirrorCompanion.apk \
            Resources/phone-parts.version "stage/CarbonMirror-$VERSION/Resources/"
          (cd stage && zip -q -r "../$ZIP" "CarbonMirror-$VERSION/Resources")
          sha256sum "$ZIP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source
          path: CarbonMirror-*-source.zip

  publish:
    if: inputs.publish
    needs: phone
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source
          path: out
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(grep -A1 '<key>CFBundleShortVersionString</key>' Resources/Info.plist | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')"
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # A short description in .github/release-notes/v<version>.md wins over the full CHANGELOG section.
          if [ -f ".github/release-notes/v$VERSION.md" ]; then
            cp ".github/release-notes/v$VERSION.md" notes.md
          else
            awk -v v="## [$VERSION]" 'index($0, v) == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          fi
          cat >> notes.md <<'NOTES'

          ### Install or update (build it yourself, one command)
          1. Download `CarbonMirror-<version>-source.zip` and check it: `shasum -a 256 ~/Downloads/CarbonMirror-*-source.zip` must print its line in `SHA256SUMS.txt`.
          2. Unzip it into your home folder, open Terminal in that folder and run `bash scripts/build-mac.sh --install`. It builds, signs with your own local certificate and installs CarbonMirror; the phone parts are already in the zip.
          3. Plug the phone in by USB: CarbonMirror → Settings → Connection → **Install Over USB…** for the companion.
          Details: INSTALL.md section 4.
          NOTES
          gh release create "v$VERSION" out/* --target "$GITHUB_SHA" --title "CarbonMirror $VERSION" --notes-file notes.md
