name: Release

# Manual only (macOS minutes are billed at 10x). publish=false builds, signs, checks and uploads the artifacts;
# publish=true also tags v<CFBundleShortVersionString> and publishes the GitHub release.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  phone:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Rust for the phone
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Server and phone core library
        run: bash scripts/build-server.sh
      - name: Companion APK (release key from the release environment, else a one-time key)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CM_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CM_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          export CM_KEYSTORE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$CM_KEYSTORE"' EXIT
          if [ -n "$KEYSTORE_BASE64" ]; then
            export CM_KEY_PASS="${CM_KEY_PASS:-$CM_KEYSTORE_PASS}"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$CM_KEYSTORE"
          else
            echo "::warning::No release keystore in the release environment: signing with a one-time P-384 key that is discarded after this run."
            export CM_KEYSTORE_PASS="$(openssl rand -hex 32)" CM_KEY_ALIAS=carbonmirror
            export CM_KEY_PASS="$CM_KEYSTORE_PASS"
            keytool -genkeypair -keyalg EC -groupname secp384r1 -sigalg SHA384withECDSA -validity 10000 \
              -dname "CN=CarbonMirror Companion one-time release key" -alias carbonmirror -storetype PKCS12 \
              -keystore "$CM_KEYSTORE" -storepass:env CM_KEYSTORE_PASS > /dev/null
          fi
          bash scripts/build-apk.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phone
          path: |
            Resources/carbonmirror-server
            Resources/libcarbon_core.so
            Resources/CarbonMirrorCompanion.apk
            dist/*.apk

  mac:
    needs: phone
    runs-on: macos-26
    environment: release
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phone
          path: .
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/cbindgen
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: mac-release-${{ hashFiles('rust/Cargo.lock') }}
      - name: Toolchain
        run: |
          rustup target add aarch64-apple-darwin
          command -v cbindgen || cargo install cbindgen --version 0.29.4 --locked
      - name: Google platform-tools adb (signature checked by build.sh)
        run: |
          curl -fsSL --retry 5 --retry-delay 2 -o "$RUNNER_TEMP/pt.zip" https://dl.google.com/android/repository/platform-tools-latest-darwin.zip
          unzip -q "$RUNNER_TEMP/pt.zip" -d "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/platform-tools/adb" Resources/adb
          shasum -a 256 "$RUNNER_TEMP/pt.zip"
      - name: Signing identity (Developer ID from the release environment, else an ephemeral "CarbonMirror Dev")
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          umask 077
          cd "$RUNNER_TEMP"
          KC="$RUNNER_TEMP/cm.keychain-db"
          KCP="$(openssl rand -hex 24)"
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          if [ -n "$CERT_BASE64" ]; then
            printf '%s' "$CERT_BASE64" | base64 -D > cert.p12
            security import cert.p12 -k "$KC" -P "$CERT_PASSWORD" -x -T /usr/bin/codesign
            rm -f cert.p12
          else
            echo "::warning::No MACOS_CERT_P12_BASE64 in the release environment: ephemeral self-signed identity (Gatekeeper will warn users)."
            P12P="$(openssl rand -hex 24)"
            printf '[req]\ndistinguished_name=dn\nprompt=no\n[dn]\nCN=CarbonMirror Dev\n[ext]\nbasicConstraints=critical,CA:false\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=critical,codeSigning\n' > cert.cnf
            /usr/bin/openssl ecparam -name secp384r1 -genkey -noout -out key.pem
            /usr/bin/openssl req -x509 -new -key key.pem -sha384 -days 30 -config cert.cnf -extensions ext -out cert.pem
            /usr/bin/openssl pkcs12 -export -inkey key.pem -in cert.pem -name "CarbonMirror Dev" -passout "pass:$P12P" -out cert.p12
            security import cert.p12 -k "$KC" -P "$P12P" -x -T /usr/bin/codesign
            rm -f key.pem cert.pem cert.p12 cert.cnf
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCP" "$KC" > /dev/null
          IDENTITY="$(security find-identity -p codesigning "$KC" | sed -n 's/^ *1) [0-9A-F]* "\([^"]*\)".*/\1/p' | head -1)"
          [ -n "$IDENTITY" ] || { echo "no signing identity in the keychain" >&2; exit 1; }
          echo "CM_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          cp /usr/bin/true sign-test && codesign --force --sign "$IDENTITY" sign-test && codesign --verify sign-test && rm sign-test
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool store-credentials cm-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KC"
            echo "CM_NOTARY_PROFILE=cm-notary" >> "$GITHUB_ENV"
            echo "CM_NOTARY_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          fi
      - name: Build, sign and package (scripts/build.sh)
        run: bash scripts/build.sh
      - name: Signature, entitlement and launch checks; screenshots
        run: |
          APP=build/CarbonMirror.app
          mkdir -p shots
          {
            codesign -dvvv "$APP" 2>&1 | grep -E "Authority|Runtime Version|CodeDirectory|Identifier|Hash type|Timestamp"
            codesign -d --entitlements - "$APP" 2>&1 | grep -v "^Executable"
            codesign -d --entitlements - "$APP/Contents/Helpers/adb" 2>&1 | grep -v "^Executable"
            codesign --verify --deep --strict --verbose=2 "$APP" 2>&1
            codesign --verify --verbose=2 dist/*.dmg 2>&1
            shasum -a 256 dist/*.dmg dist/*.apk
          } > checks.log
          open -a "$PWD/$APP"
          sleep 6
          screencapture -x -t jpg shots/real-launch-hidden-from-capture.jpg
          osascript -e 'tell application "System Events" to keystroke "," using command down' || true
          sleep 2
          screencapture -x -t jpg shots/settings.jpg
          pgrep -x CarbonMirror > /dev/null && echo "APP ALIVE after real launch + Settings" >> checks.log || echo "APP DIED after real launch + Settings" >> checks.log
          pkill -x CarbonMirror || true
          sleep 1
          defaults write "$HOME/Library/Containers/com.nomadicrebel.carbonmirror/Data/Library/Preferences/com.nomadicrebel.carbonmirror" hideFromCapture -bool false
          open -a "$PWD/$APP" --args --demo
          for i in $(seq -w 1 44); do sleep 0.45; screencapture -x -t jpg "shots/demo-$i.jpg"; done
          pgrep -x CarbonMirror > /dev/null && echo "APP ALIVE in demo" >> checks.log || echo "APP DIED in demo" >> checks.log
          pkill -x CarbonMirror || true
          cp ~/Library/Logs/DiagnosticReports/CarbonMirror* shots/ 2> /dev/null || true
          cat checks.log
          ! grep -q "APP DIED" checks.log
      - name: Remove the ephemeral identity
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/cm.keychain-db" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mac
          path: |
            dist/*.dmg
            build.log
            checks.log
            shots

  publish:
    if: inputs.publish
    needs: [phone, mac]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(grep -A1 '<key>CFBundleShortVersionString</key>' Resources/Info.plist | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')"
          mkdir out
          cp artifacts/mac/dist/*.dmg artifacts/phone/dist/*.apk out/
          git archive --format=zip --prefix="CarbonMirror-$VERSION/" -o "out/CarbonMirror-$VERSION-source.zip" HEAD
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" out/* --target "$GITHUB_SHA" --title "CarbonMirror $VERSION" --notes-file notes.md
