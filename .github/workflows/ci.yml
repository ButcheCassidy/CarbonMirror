name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.d.outputs.android }}
      macos: ${{ steps.d.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          [ -f android/gradlew ] && echo "android=true" >> "$GITHUB_OUTPUT" || echo "android=false" >> "$GITHUB_OUTPUT"
          # macOS minutes are expensive: build only when something that reaches the Mac app changed.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             || git diff --name-only "$BEFORE" "$GITHUB_SHA" -- Sources Tests Package.swift rust Resources scripts .github/workflows/ci.yml | grep -q .; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    needs: detect
    if: needs.detect.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon lint test assembleDebug

  macos:
    needs: detect
    if: needs.detect.outputs.macos == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: mac-rust-${{ hashFiles('rust/Cargo.lock') }}
      - name: Rust core (static library)
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin --manifest-path rust/carbon-core/Cargo.toml
      - name: Swift build (Swift 6, warnings listed)
        run: |
          set -o pipefail
          swift --version
          swift build -c release --arch arm64 2>&1 | tee build.log
          grep -E ": (warning|error):" build.log | sort -u > diagnostics.txt || true
          echo "diagnostics: $(wc -l < diagnostics.txt)"
          cat diagnostics.txt
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: build.log
